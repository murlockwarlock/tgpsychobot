name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ci-test-token
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TESTING: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run full test suite
        run: python -m pytest -q -rs

  postgres-event-chains:
    name: event chains (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ci-test-token
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TESTING: "true"
      POSTGRES_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_event_chains_ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Create disposable PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE test_event_chains_ci'
      - name: Run PostgreSQL migration and concurrency checks
        run: >-
          python -m pytest -q -rs
          tests/test_event_chains_db.py::test_real_postgresql_init_and_schema_verification
          tests/test_event_chains_db.py::test_real_postgresql_migration_backfills_delivery_content_version_snapshot
          tests/test_event_chains_db.py::test_real_postgresql_structural_invariants_and_retry_model
          tests/test_event_chains_db.py::test_real_postgresql_update_step_vs_reschedule_concurrency
          tests/test_event_chains_db.py::test_real_postgresql_claimed_update_step_vs_presend_barrier
          tests/test_event_chains_worker.py::test_real_postgresql_pre_send_lock_hierarchy_and_cas
          tests/test_event_chains_worker.py::test_cancel_vs_worker_ponr_concurrency_postgresql
          tests/test_event_chains_service.py::test_real_postgresql_rejoin_vs_reschedule_deadlock_free
      - name: Drop disposable PostgreSQL database
        if: ${{ always() }}
        env:
          PGPASSWORD: postgres
        run: dropdb -h 127.0.0.1 -U postgres --if-exists test_event_chains_ci
