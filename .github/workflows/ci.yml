name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  workflow_dispatch:
    inputs:
      force_full_ci:
        description: 'Force FULL CI suite run (all tests + postgres)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-ci:
    name: Fast CI (Draft PR)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: ci-test-token
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TESTING: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Fetch base branch for git diff
        run: git fetch origin main --depth=50
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Install PM2 for real process integration tests
        run: npm install -g pm2
      - name: Run Fast CI Suite
        run: python scripts/run_fast_ci.py

  sqlite:
    name: pytest (SQLite shard ${{ matrix.shard }}/3)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BOT_TOKEN: ci-test-token
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TESTING: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Install PM2 for real process integration tests
        run: npm install -g pm2
      - name: Verify test shard coverage and collection
        if: matrix.shard == 1
        run: python scripts/ci_test_shards.py --verify
      - name: Run test shard
        run: python scripts/ci_test_shards.py --shard ${{ matrix.shard }} --total-shards 3 --run

  postgres-event-chains:
    name: event chains (PostgreSQL)
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'full-ci') && inputs.force_full_ci != true && inputs.force_full_ci != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ci-test-token
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TESTING: "true"
      POSTGRES_TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/test_event_chains_ci"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Create disposable PostgreSQL database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE test_event_chains_ci'
      - name: Run PostgreSQL migration and concurrency checks
        run: python -m pytest -q -rs -m postgres_integration
      - name: Drop disposable PostgreSQL database
        if: ${{ always() }}
        env:
          PGPASSWORD: postgres
        run: dropdb -h 127.0.0.1 -U postgres --if-exists test_event_chains_ci

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - fast-ci
      - sqlite
      - postgres-event-chains
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate CI Gate Results (Fail-Closed)
        run: python scripts/ci_gate.py "${{ needs.fast-ci.result }}" "${{ needs.sqlite.result }}" "${{ needs.postgres-event-chains.result }}"
